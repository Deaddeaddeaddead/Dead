plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dead.unlockvideo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dead.unlockvideo'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Постоянный ключ, чтобы новые сборки ставились поверх старых без удаления.
    signingConfigs {
        shared {
            storeFile file('signing.keystore')
            storePassword 'videowallpaper'
            keyAlias 'wallpaper'
            keyPassword 'videowallpaper'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
