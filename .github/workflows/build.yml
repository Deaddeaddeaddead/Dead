name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk VideoWallpaper.apk
      - name: Publish APK to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub иногда отвечает 500 — пробуем несколько раз.
          for attempt in 1 2 3 4; do
            gh release delete latest --yes --cleanup-tag || true
            if gh release create latest VideoWallpaper.apk \
                --target "${{ github.sha }}" \
                --title "Видеообои — последняя сборка" \
                --notes "Скачайте VideoWallpaper.apk и установите на телефон."; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
